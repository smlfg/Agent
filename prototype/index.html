<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentfähig — Visuelles Mockup</title>
  <style>
    :root {
      /* warm pole (default) */
      --bg-start: #F6F1E9;
      --bg-end: #EDE4D3;
      --stroke: #4A3F35;
      --stroke-opacity: 0.22;
      --eye-fill: #3D3229;
      --catchlight: #F6F1E9;
      --accent: #C17A4D;
      --text: #3D3229;
      --muted: #7A6B5D;
      --input-border: rgba(74, 63, 53, 0.35);
      --softness: 18px;
      --motion-speed: 1;
      --field-drift: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Bricolage Grotesque", "Newsreader", Georgia, serif;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text);
      overflow: hidden;
      transition: background 0.8s ease, color 0.8s ease;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* scribble field */
    #scribble-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      transition: opacity 0.6s ease;
    }
    #scribble-field svg {
      width: 100%;
      height: 100%;
    }
    #scribble-field path {
      stroke: var(--stroke);
      stroke-opacity: var(--stroke-opacity);
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      transition: stroke 0.8s ease, stroke-opacity 0.8s ease;
      transform: translate(var(--field-drift), 0);
    }

    /* eyes container */
    #eyes {
      position: relative;
      width: 220px;
      height: 90px;
      margin-top: -10vh;
      margin-bottom: 6vh;
      z-index: 2;
      animation: breathe 5s ease-in-out infinite;
      animation-duration: calc(5s / var(--motion-speed));
    }

    .eye {
      position: absolute;
      width: 70px;
      height: 42px;
      top: 24px;
      border-radius: var(--softness);
      background: var(--eye-fill);
      transition: background 0.8s ease, border-radius 0.8s ease;
      overflow: hidden;
    }
    .eye.left { left: 25px; }
    .eye.right { right: 25px; }

    .eye::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 8px;
      background: var(--catchlight);
      border-radius: 50%;
      opacity: 0.8;
      top: 10px;
      left: 18px;
      transform: rotate(-12deg);
    }
    .eye.right::after { left: 14px; top: 12px; transform: rotate(8deg); }

    .lid {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      transform-origin: top;
      transform: scaleY(0);
      transition: transform 0.12s ease;
    }

    /* pathway threads */
    #pathway-threads {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #pathway-threads.active { opacity: 1; }
    .thread {
      position: absolute;
      height: 1.5px;
      width: 140px;
      background: var(--accent);
      opacity: 0.25;
      transition: opacity 0.6s ease;
    }
    .thread.what { top: 42%; left: 8%; transform: rotate(-12deg); }
    .thread.create { top: 18%; left: 50%; transform: translateX(-50%) rotate(90deg); }
    .thread.product { top: 42%; right: 8%; transform: rotate(12deg); }
    .thread.what.active { opacity: 0.7; }

    /* sliders */
    #sliders {
      z-index: 2;
      display: flex;
      gap: 28px;
      margin-bottom: 6vh;
      padding: 18px 26px;
      border-radius: calc(var(--softness) * 1.5);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(4px);
      transition: border-radius 0.8s ease, background 0.8s ease;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .slider-group label { min-width: 34px; text-align: right; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 130px;
      height: 3px;
      background: var(--input-border);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.8s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }

    /* response area */
    #response-area {
      z-index: 2;
      width: min(680px, 86vw);
      min-height: 120px;
      padding: 22px 28px;
      border-radius: calc(var(--softness) * 1.2);
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(6px);
      font-size: 20px;
      line-height: 1.55;
      color: var(--text);
      transition: border-radius 0.8s ease, background 0.8s ease, color 0.8s ease;
    }
    #response-text {
      min-height: 1.6em;
      white-space: pre-wrap;
    }
    #response-text .word {
      display: inline-block;
      margin-right: 0.28em;
      opacity: 0;
      transform: translateY(4px) scale(0.98);
      animation: appear 0.35s ease forwards;
    }
    @keyframes appear {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* input line */
    #input-line {
      z-index: 2;
      margin-top: 18px;
      width: min(680px, 86vw);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #user-input {
      flex: 1;
      height: 56px;
      padding: 0 22px;
      border: 1.5px solid var(--input-border);
      border-radius: calc(var(--softness) * 1.1);
      background: rgba(255,255,255,0.12);
      font-size: 17px;
      color: var(--text);
      outline: none;
      transition: border-radius 0.8s ease, background 0.8s ease, color 0.8s ease, border-color 0.8s ease;
    }
    #user-input::placeholder { color: var(--muted); opacity: 0.7; }
    #user-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.2); }

    #mic {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    #mic:hover { background: var(--accent); color: #fff; transform: scale(1.05); }

    /* helper text */
    #hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
      opacity: 0.7;
      z-index: 2;
      text-align: center;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce) {
      #eyes, .word { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="scribble-field"><svg id="scribble-svg"></svg></div>

    <div id="pathway-threads">
      <div class="thread what"></div>
      <div class="thread create"></div>
      <div class="thread product"></div>
    </div>

    <div id="eyes">
      <div class="eye left"><div class="lid"></div></div>
      <div class="eye right"><div class="lid"></div></div>
    </div>

    <div id="sliders">
      <div class="slider-group">
        <label>warm</label>
        <input type="range" id="warm-cold" min="0" max="100" value="15" />
        <label>cold</label>
      </div>
      <div class="slider-group">
        <label>soft</label>
        <input type="range" id="soft-sharp" min="0" max="100" value="20" />
        <label>sharp</label>
      </div>
      <div class="slider-group">
        <label>still</label>
        <input type="range" id="still-alive" min="0" max="100" value="25" />
        <label>alive</label>
      </div>
    </div>

    <div id="response-area">
      <div id="response-text"></div>
    </div>

    <div id="input-line">
      <input type="text" id="user-input" placeholder="Sag, womit ich dir helfen kann…" autocomplete="off" />
      <button id="mic" title="Spracheingabe">🎤</button>
    </div>

    <div id="hint">Visuelles Mockup — keine Funktion, nur Look & Feel. Slider bewegen, tippen und Enter drücken.</div>
  </div>

  <script>
    const root = document.documentElement;
    const svg = document.getElementById('scribble-svg');
    const warmCold = document.getElementById('warm-cold');
    const softSharp = document.getElementById('soft-sharp');
    const stillAlive = document.getElementById('still-alive');
    const input = document.getElementById('user-input');
    const responseText = document.getElementById('response-text');
    const threads = document.getElementById('pathway-threads');

    // generate hand-drawn scribble field
    function buildScribble() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cx = w / 2;
      const cy = h / 2 - 60;
      let paths = '';
      const count = Math.min(110, Math.max(60, Math.floor(w * 0.08)));
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 220 + (Math.random() * 120);
        const x1 = cx + Math.cos(angle) * dist;
        const y1 = cy + Math.sin(angle) * dist;
        const len = 16 + Math.random() * 28;
        const dir = angle + (Math.random() - 0.5) * 1.2;
        const x2 = x1 + Math.cos(dir) * len;
        const y2 = y1 + Math.sin(dir) * len;
        const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * 8;
        const my = (y1 + y2) / 2 + (Math.random() - 0.5) * 8;
        paths += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" />`;
      }
      svg.innerHTML = paths;
    }
    buildScribble();
    window.addEventListener('resize', buildScribble);

    // palettes
    function updateStyle() {
      const warm = parseInt(warmCold.value) / 100;
      const soft = parseInt(softSharp.value) / 100;
      const alive = parseInt(stillAlive.value) / 100;

      // warm -> cold interpolation
      root.style.setProperty('--bg-start', interpolateColor('#F6F1E9', '#EEF2F7', warm));
      root.style.setProperty('--bg-end', interpolateColor('#EDE4D3', '#DFE7F2', warm));
      root.style.setProperty('--stroke', interpolateColor('#4A3F35', '#2C3E5C', warm));
      root.style.setProperty('--eye-fill', interpolateColor('#3D3229', '#1E2D44', warm));
      root.style.setProperty('--accent', interpolateColor('#C17A4D', '#5B9BD5', warm));
      root.style.setProperty('--text', interpolateColor('#3D3229', '#1E2D44', warm));
      root.style.setProperty('--muted', interpolateColor('#7A6B5D', '#5F7289', warm));

      // soft -> sharp
      const radius = 18 - soft * 14; // 18 -> 4
      root.style.setProperty('--softness', `${radius}px`);
      root.style.setProperty('--stroke-opacity', `${0.22 + soft * 0.12}`);

      // still -> alive
      root.style.setProperty('--motion-speed', `${0.55 + alive * 1.1}`);
      root.style.setProperty('--field-drift', `${alive * 6 - 3}px`);
    }

    function interpolateColor(a, b, t) {
      const ah = parseInt(a.slice(1,3), 16), ag = parseInt(a.slice(3,5), 16), ab = parseInt(a.slice(5,7), 16);
      const bh = parseInt(b.slice(1,3), 16), bg = parseInt(b.slice(3,5), 16), bb = parseInt(b.slice(5,7), 16);
      const rh = Math.round(ah + (bh - ah) * t).toString(16).padStart(2,'0');
      const rg = Math.round(ag + (bg - ag) * t).toString(16).padStart(2,'0');
      const rb = Math.round(ab + (bb - ab) * t).toString(16).padStart(2,'0');
      return `#${rh}${rg}${rb}`;
    }

    [warmCold, softSharp, stillAlive].forEach(s => s.addEventListener('input', updateStyle));
    updateStyle();

    // blinking
    function blink() {
      document.querySelectorAll('.lid').forEach(lid => {
        lid.style.transform = 'scaleY(1)';
        setTimeout(() => lid.style.transform = 'scaleY(0)', 160 + Math.random() * 80);
      });
      setTimeout(blink, 2000 + Math.random() * 3000);
    }
    setTimeout(blink, 1500);

    // fake response
    const fakeAnswers = [
      "Agentfähig ist ein Interface, bei dem die Website selbst als Agent erlebbar wird.",
      "Ich bin ein Agent. Du bestimmst, wohin die Reise geht — ich helfe dir dabei."
    ];

    input.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter' || !input.value.trim()) return;
      const q = input.value.trim();
      input.value = '';
      responseText.innerHTML = '';
      threads.classList.add('active');
      document.querySelector('.thread.what').classList.toggle('active', q.toLowerCase().includes('was'));

      // thinking pause
      await wait(900);

      const text = q.toLowerCase().includes('was') || q.toLowerCase().includes('du')
        ? fakeAnswers[1]
        : fakeAnswers[0];
      const words = text.split(' ');

      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = w;
        responseText.appendChild(span);
        const len = w.length;
        const delay = len < 4 ? 90 : len < 8 ? 170 : 320;
        await wait(delay / (0.7 + parseInt(stillAlive.value) / 100));
      }

      await wait(1200);
      threads.classList.remove('active');
      document.querySelector('.thread.what').classList.remove('active');
    });

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
  </script>
</body>
</html>
