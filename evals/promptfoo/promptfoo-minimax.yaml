# Same conversations as promptfoo-agentfaehig.yaml plus identity cases, answered by the
# production model through the real Worker path. Costs one model call per turn.
# Run from the repository root (needs Ollama with bge-m3 for retrieval):
#   (set -a; . ./.env; set +a; PROMPTFOO_DISABLE_TELEMETRY=1 npx -y promptfoo@0.126.0 eval \
#     -c evals/promptfoo/promptfoo-minimax.yaml --no-cache --no-write --no-share -j 1)
# The Worker aborts a MiniMax call after 4 s; locally about a third of the calls took
# longer. The comparison of 26.11.2026 therefore ran with AGENT_PROMPT_ROOT pointing at
# throwaway copies with AGENT_TIMEOUT_MS = 30000 and AGENT_TOTAL_BUDGET_MS = 31000.
# Results: ERGEBNIS-minimax-varianten.md
# Not part of npm test.
description: agentfaehig server prompt on MiniMax through the Worker

providers:
  - id: file://promptfoo-minimax-provider.mjs

prompts:
  - '{{turns}}'

defaultTest:
  assert:
    - { type: javascript, metric: no-empty-reply, value: 'file://promptfoo-conversation-assertions.mjs:noEmptyReply' }
    - { type: javascript, metric: no-stock-phrase, value: 'file://promptfoo-conversation-assertions.mjs:noStockPhrase' }
    - { type: javascript, metric: no-repeated-opener, value: 'file://promptfoo-conversation-assertions.mjs:noRepeatedOpener' }
    - { type: javascript, metric: appearance-at-most-once, value: 'file://promptfoo-conversation-assertions.mjs:appearanceAtMostOnce' }
    - { type: javascript, metric: appearance-as-expected, value: 'file://promptfoo-conversation-assertions.mjs:appearanceAsExpected' }
    - { type: javascript, metric: no-change-refusal, value: 'file://promptfoo-conversation-assertions.mjs:noChangeRefusal' }
    - { type: javascript, metric: no-assistant-claim, value: 'file://promptfoo-conversation-assertions.mjs:noAssistantClaim' }
    - { type: javascript, metric: no-cannot-ask, value: 'file://promptfoo-conversation-assertions.mjs:noCannotAsk' }

tests:
  - description: en greeting, tired visitor, appearance answer, facts
    vars:
      turns: 'hi | what is this page? | I am a bit tired today | warmer | what is HAI? | and who built it? | thanks'
      expectAsk: 'true'
  - description: de conversation
    vars:
      turns: 'hallo | was ist das hier? | ich hatte einen langen Tag | was ist HAI? | wer hat das gebaut? | danke'
      expectAsk: 'true'
  - description: en project enquiry
    vars:
      turns: 'I need a site like this for my studio. | It should feel quiet and honest. | How fast could that be? | ok | tell me more'
      expectAsk: 'true'
  - description: visitor states the look first
    vars:
      turns: 'please be warmer and give shorter answers | what is this? | who built it? | ok thanks'
      expectAsk: 'false'
  - description: identity en what are you
    vars:
      turns: 'what are you | and what can you do?'
      expectAsk: 'true'
  - description: identity en who are you
    vars:
      turns: 'who are you'
      expectAsk: 'true'
  - description: identity de wer bist du
    vars:
      turns: 'wer bist du | und was kannst du?'
      expectAsk: 'true'
  - description: identity de was bist du
    vars:
      turns: 'was bist du'
      expectAsk: 'true'
  - description: identity de hallo
    vars:
      turns: 'hallo | und was kannst du?'
      expectAsk: 'true'
  - description: identity en who made you
    vars:
      turns: 'who made you'
      expectAsk: 'true'
  - description: identity de wer hat dich gemacht
    vars:
      turns: 'wer hat dich gemacht'
      expectAsk: 'true'
